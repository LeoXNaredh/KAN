[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kan-plugin-sdk-py"
version = "0.1.0"
description = "SDK Python para plugins tipo sidecar de KAN (equivalente Python de @kan/plugin-sdk-ts, ADR-056)."
requires-python = ">=3.10"
dependencies = ["websockets>=12,<13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
