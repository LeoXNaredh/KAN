<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- style-src/font-src amplían por Geist Sans (mismo tipo que apps/web,
         ver index.css) — únicos dos hosts externos permitidos, el resto de
         la CSP sigue igual de restrictiva. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>KAN Edge Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
