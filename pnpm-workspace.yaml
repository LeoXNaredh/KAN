packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"
allowBuilds:
  '@abandonware/bluetooth-hci-socket': false
  '@abandonware/noble': false
  '@google/genai': true
  '@serialport/bindings-cpp': true
  # Dependencia nativa opcional de `ssh2` (aceleración de crypto) —
  # ssh2 funciona igual en JS puro sin ella (optionalDependencies real,
  # no un requisito). `false` a propósito, mismo criterio que
  # `@abandonware/noble`/`epoll` en este archivo: binding nativo que
  # necesitaría el toolchain de C++ que no está instalado acá.
  cpu-features: false
  electron: true
  # Dependencia transitiva de `onoff` (@kan/plugin-raspberry-pi, ADR-038) —
  # usada para detección de interrupciones por cambio de pin (gpio.watch()),
  # que este plugin no llama. `false` a propósito, mismo criterio que
  # `@abandonware/noble`/`usb` en este archivo: es un binding nativo
  # Linux/Pi-específico (epoll de Linux) que no compila en Windows/Mac (sin
  # toolchain de C++ para eso acá) ni hace falta en desarrollo — se resuelve
  # en la Pi real donde corre de verdad, no en la máquina de desarrollo.
  epoll: false
  esbuild: true
  protobufjs: true
  # El script de install de ssh2 solo intenta compilar sus dependencias
  # opcionales (cpu-features/nan, ver arriba) — sin ellas, ssh2 sigue
  # funcionando en JS puro. `false` por el mismo motivo.
  ssh2: false
  unrs-resolver: true
  usb: false
minimumReleaseAgeExclude:
  - '@google/genai@2.16.0'
