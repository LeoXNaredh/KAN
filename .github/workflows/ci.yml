name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ github.sha }}
          restore-keys: turbo-lint-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: turbo-test-
      - run: pnpm install --frozen-lockfile
      # --concurrency=1: correr todos los paquetes con la concurrencia por
      # defecto de turbo hizo crashear los workers de vitest de varios
      # paquetes en esta misma sesion (contencion de recursos -- varios
      # tests levantan servidores reales: OPCUA, un broker MQTT, SSH, WS,
      # timers de cron -- todos peleando por puertos/recursos al mismo
      # tiempo). Un runner de GitHub Actions con menos CPU que la maquina
      # de desarrollo tiene aun mas riesgo de este mismo crash. Serial es
      # mas lento pero confiable -- un gate de CI flaky es peor que uno lento.
      - run: pnpm turbo run test --concurrency=1

  # Fix de auditoría de backend #5: kan-plugin-sdk-py y los dos plugins
  # sidecar (bluetooth-py, vision-py) tenían tests reales desde ADR-056/el
  # incremento BLE, pero nada corría pytest en CI — un regression ahí
  # pasaba desapercibido hasta que alguien lo notara a mano. No usa los
  # requirements.txt de cada plugin (esos instalan kan-plugin-sdk-py desde
  # un tag de git remoto, pensados para la instalación real de
  # PluginInstaller, ADR-056 Fase 3) — acá se instala en editable desde el
  # propio checkout, para probar el código que realmente está en este commit.
  test-python:
    name: Test (sidecars Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e packages/kan-plugin-sdk-py[dev]
      # Mismas versiones que requirements.txt de cada plugin (bleak para
      # bluetooth-py; opencv-python-headless/numpy para vision-py) — headless
      # porque el runner de CI no tiene GPU/display, y los tests nunca abren
      # una ventana (ADR-012: todo contra fakes, sin cámara/BLE real).
      - run: pip install "bleak>=0.22,<1" "opencv-python-headless>=4.9,<5" "numpy>=1.26,<3"
      - run: python -m pytest packages/kan-plugin-sdk-py
      - run: python -m pytest plugins/plugin-bluetooth-py
      - run: python -m pytest plugins/plugin-vision-py

  build:
    name: Build (web + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          # Next.js no necesita estos valores reales para un build 100%
          # dinamico (todas las rutas de apps/web son `ƒ`, ninguna se
          # pre-renderiza en build time) -- son un colchon de seguridad
          # por si algun modulo llega a leerlos en import time, no un
          # requisito confirmado.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_KAN_GATEWAY_WS_URL: wss://placeholder.example.com/edge
          NEXT_PUBLIC_KAN_GATEWAY_LIVE_VOICE_WS_URL: wss://placeholder.example.com/live-voice
        run: pnpm turbo run build --filter=web --filter=desktop
